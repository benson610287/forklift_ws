controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.26
    
    # MPPI Controller parameters (模型預測路徑積分控制器)
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56                      # 時間步數：模擬軌跡的時間步長數量
      model_dt: 0.05                      # 模型時間增量：每個時間步的持續時間(秒)
      batch_size: 2000                    # 批次大小：每次迭代生成的軌跡候選數量
      vx_std: 0.15                        # X方向速度標準差：用於軌跡採樣的噪聲
      vy_std: 0.15                        # Y方向速度標準差：用於軌跡採樣的噪聲
      wz_std: 0.2                         # 角速度標準差：用於軌跡採樣的噪聲
      vx_max: 0.125                       # X方向最大速度 (m/s)
      vx_min: -0.0875                     # X方向最小速度 (m/s)
      vy_max: 0.125                       # Y方向最大速度 (m/s)
      wz_max: 0.475                       # 最大角速度 (rad/s)
      iteration_count: 1                  # 迭代次數：每個控制週期的優化迭代次數
      prune_distance: 1.7                 # 修剪距離：軌跡修剪的距離閾值
      transform_tolerance: 1.0            # 座標轉換容差：TF變換的容差時間
      temperature: 0.3                    # 溫度參數：控制軌跡選擇的隨機性
      gamma: 0.015                        # 折扣因子：未來成本的權重衰減
      motion_model: "Omni"                # 運動模型：全向運動模型
      visualize: True                    # 可視化：是否在RViz中顯示軌跡
      reset_period: 1.0                   # 重置週期：(僅Humble版本)
      regenerate_noises: false            # 重新生成噪聲：是否每次重新生成隨機噪聲
      
      # 軌跡可視化器設置
      TrajectoryVisualizer:
        trajectory_step: 5                # 軌跡步長：可視化時軌跡點的間隔
        time_step: 3                      # 時間步長：可視化時時間點的間隔
      
      # 阿克曼約束 (雖然使用全向模型，但保留以防需要)
      AckermannConstraints:
        min_turning_radius: 0.2           # 最小轉彎半徑 (m)
      
      # 評判器列表：評估軌跡品質的不同標準
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      
      # 約束評判器：檢查軌跡是否滿足運動約束
      ConstraintCritic:
        enabled: true
        cost_power: 1                     # 成本冪次：成本函數的冪次
        cost_weight: 4.0                  # 成本權重：此評判器的相對重要性
      
      # 目標評判器：評估軌跡到達目標的能力
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4        # 考慮閾值：開始考慮此評判器的距離
      
      # 目標角度評判器：評估軌跡的最終朝向
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      
      # 偏好前進評判器：鼓勵前進運動
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      
      # 障礙物評判器：避免碰撞
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 2.5             # 排斥權重：遠離障礙物的力度
        critical_weight: 30.0             # 關鍵權重：接近障礙物時的懲罰
        consider_footprint: true         # 考慮機器人足跡：是否使用機器人的實際形狀
        collision_cost: 10000.0           # 碰撞成本：碰撞的懲罰值
        collision_margin_distance: 0.1    # 碰撞邊界距離：安全邊界
        near_goal_distance: 0.3           # 接近目標距離：放寬障礙物檢查的距離
        inflation_radius: 1.15          # 膨脹半徑：障礙物膨脹的半徑
        cost_scaling_factor: 15.0         # 成本縮放因子：成本地圖的縮放係數
      
      # 路徑對齊評判器：保持軌跡與規劃路徑對齊
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05    # 最大路徑佔用比：路徑被障礙物佔用的最大比例
        trajectory_point_step: 3          # 軌跡點步長：評估軌跡點的間隔
        threshold_to_consider: 0.5
        offset_from_path: 0.0             # 路徑偏移：允許的路徑偏移量
        use_path_orientations: false      # 使用路徑方向：是否考慮路徑的方向信息
      
      # 路徑跟隨評判器：鼓勵沿著路徑行進
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_path: 0.0
        threshold_to_consider: 1.4
      
      # 路徑角度評判器：評估軌跡與路徑方向的一致性
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_path: 0.0
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0        # 最大角度：允許的最大角度偏差
        forward_preference: true          # 前進偏好：是否偏好前進方向
      
      # 速度死區評判器 (已註解)：避免過小的速度指令
      # VelocityDeadbandCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 35.0
      #   deadband_velocities: [0.05, 0.05, 0.05]  # 死區速度：低於此值的速度被視為零
      
      # 旋轉評判器 (已註解)：避免過度旋轉
      # TwirlingCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[1.1, 0.32], [1.1, -0.32], [-0.4, -0.32], [-0.4, 0.32]]"
      # robot_radius: 0.4
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 1.15
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_multi
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          max_message_age: 2.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True
      scale_velocities: False
      feedback: "OPEN_LOOP"
      max_velocity: [0.125, 0.125, 0.475]
      min_velocity: [-0.0875, -0.0875, -0.475]
      max_accel: [0.375, 0.375, 0.5]
      max_decel: [-0.375, -0.375, -0.5]
      odom_topic: "odom"
      odom_duration: 0.1
      deadband_velocity: [0.0, 0.0, 0.0]

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      footprint: "[[1.1, 0.32], [1.1, -0.32], [-0.5, -0.32], [-0.5, 0.32]]"
      # robot_radius: 1.20
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_multi
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          max_message_age: 2.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 1.15
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    
    # SmacPlannerLattice 規劃器配置 (基於格狀搜索的混合A*規劃器)
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      tolerance: 0.2                          # 容差：到達目標點的允許誤差 (m)
      use_astar: false                        # 使用A：false則使用Theta，true則使用A*
      allow_unknown: false                     # 允許未知區域：是否允許路徑經過未知區域
      how_many_corners: 8                     # 角落數量：搜索時考慮的鄰居方向數(4或8)
      w_euc_cost: 1.0                         # 歐幾里得成本權重：直線距離的權重
      w_traversal_cost: 3.0                   # 遍歷成本權重：通過格子的成本權重
      w_heuristic_cost: 1.0                   # 啟發式成本權重：啟發式函數的權重

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
      distance: 0.5              # 增加到 0.5m，確保後退足夠遠
      speed: -0.3                # 調整到 -0.3m/s，適應倉庫環境
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.0
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.125, 0.125, 0.475]
    min_velocity: [-0.0875, -0.0875, -0.475]
    max_accel: [0.375, 0.375, 0.5]
    max_decel: [-0.375, -0.375, -0.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0