octomap_resolution: 0.02
octomap_frame: world
sensors:  
  - azure_kinect
azure_kinect:
    sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
    point_cloud_topic: /combined_points
    max_range: 1.8
    frame_subsample: 1
    point_subsample: 2
    padding_offset: 0.001
    padding_scale: 0.05
    max_update_rate: 2.0
    filtered_cloud_topic: filtered_cloud
    shape_transform: true
    filter_speckles: true
    latch: false
